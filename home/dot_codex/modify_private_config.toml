{{- /* chezmoi:modify-template */ -}}
{{- $inRoot := true -}}
{{ printf "sandbox_mode = \"workspace-write\"\napproval_policy = \"on-request\"\napprovals_reviewer = \"auto_review\"\n" -}}
{{- range splitList "\n" (.chezmoi.stdin | trimSuffix "\n") -}}
{{- if hasPrefix "[" (trim .) -}}
{{- $inRoot = false -}}
{{- end -}}
{{- if not (and $inRoot (regexMatch `^\s*(sandbox_mode|approval_policy|approvals_reviewer)\s*=` .)) -}}
{{ printf "%s\n" . }}
{{- end -}}
{{- end -}}
